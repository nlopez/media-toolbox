name: ci

on:
  push:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC - check for a new yt-dlp release
  workflow_dispatch:
    inputs:
      yt_dlp_version:
        description: 'yt-dlp release tag to build (e.g. 2026.08.19). Blank = use the version pinned in nix/versions.json.'
        required: false
        default: ''

permissions:
  contents: write   # push the version-bump commit back to the branch
  packages: write   # push images to GHCR

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      -
        name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      -
        name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          # Exact hit when nothing changed; otherwise restore the newest cache and rebuild the delta
          # (a yt-dlp bump changes nix/versions.json, so most runs take the prefix fallback).
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # Keep the saved store bounded; the closure is ~2.5 GiB.
          gc-max-store-size-linux: 4G
          # Drop stale caches so daily keys don't eat the repo's 10 GiB cache quota.
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-last-accessed: 604800
      -
        name: Resolve yt-dlp version
        id: version
        run: |
          set -euo pipefail
          PINNED=$(jq -r .ytDlp.version nix/versions.json)
          MANUAL="${{ github.event.inputs.yt_dlp_version }}"

          if [ -n "$MANUAL" ]; then
            TARGET="$MANUAL"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            TARGET=$(curl -sSL --connect-timeout 30 --max-time 60 \
              -H 'Accept: application/vnd.github+json' \
              -H 'Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' \
              https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest \
              | jq -r '.tag_name // empty')
            [ -n "$TARGET" ] || { echo "::error::could not resolve latest yt-dlp release"; exit 1; }
          else
            TARGET="$PINNED"
          fi

          {
            echo "pinned=$PINNED"
            echo "target=$TARGET"
            if [ "$TARGET" != "$PINNED" ]; then echo "changed=true"; else echo "changed=false"; fi
          } >> "$GITHUB_OUTPUT"
          echo "Pinned: $PINNED | Target: $TARGET"
      -
        name: Bump yt-dlp version in nix/versions.json
        if: steps.version.outputs.changed == 'true'
        run: |
          set -euo pipefail
          scripts/update-versions.sh yt-dlp "${{ steps.version.outputs.target }}"
          git diff -- nix/versions.json
      -
        name: Build image
        run: |
          set -euo pipefail
          nix build .#image --print-build-logs --out-link image-stream
          ./image-stream > image.tar
      -
        name: Smoke test image
        run: |
          set -euo pipefail
          docker load -i image.tar
          # The image entrypoint is bash, so the arguments below are `bash -c ...`.
          docker run --rm "nlopez/media-toolbox:${{ steps.version.outputs.target }}" \
            -c 'yt-dlp --version && ffmpeg -version | head -1 && tubeup --help >/dev/null && atuin --version && ls ~/.config/yt-dlp/plugins'
      -
        name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Tag and push
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          TARGET="${{ steps.version.outputs.target }}"
          SHA="${{ github.sha }}"
          # `docker push` of a docker-loaded Nix image sends the layers uncompressed (~2.5 GiB).
          # skopeo gzips them on upload. Push once from the archive, then copy to the other tags.
          HUB=docker.io/nlopez/media-toolbox
          GHCR=ghcr.io/nlopez/media-toolbox
          skopeo copy --retry-times 3 "docker-archive:image.tar" "docker://${HUB}:${TARGET}"
          skopeo copy --retry-times 3 "docker://${HUB}:${TARGET}" "docker://${HUB}:${TARGET}-${SHA}"
          skopeo copy --retry-times 3 "docker://${HUB}:${TARGET}" "docker://${HUB}:${SHA}"
          for tag in "${TARGET}" "${TARGET}-${SHA}" "${SHA}"; do
            skopeo copy --retry-times 3 "docker://${HUB}:${TARGET}" "docker://${GHCR}:${tag}"
          done
      -
        name: Commit yt-dlp version bump
        if: steps.version.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          TARGET="${{ steps.version.outputs.target }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/versions.json
          git commit -m "chore: bump yt-dlp to $TARGET [skip ci]"
          git push origin HEAD:main
