name: ci

on:
  push:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC - check for a new yt-dlp release
  workflow_dispatch:
    inputs:
      yt_dlp_version:
        description: 'yt-dlp release tag to build (e.g. 2026.08.19). Blank = use the version pinned in the Makefile.'
        required: false
        default: ''

permissions:
  contents: write   # push the version-bump commit back to the branch
  packages: write   # push images to GHCR

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      -
        name: Resolve yt-dlp version
        id: version
        run: |
          set -euo pipefail
          PINNED=$(grep '^YT_DLP_VERSION' Makefile | cut -d= -f2 | tr -d ' ')
          MANUAL="${{ github.event.inputs.yt_dlp_version }}"

          if [ -n "$MANUAL" ]; then
            TARGET="$MANUAL"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            TARGET=$(curl -sSL --connect-timeout 30 --max-time 60 \
              -H 'Accept: application/vnd.github+json' \
              -H 'Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' \
              https://api.github.com/repos/yt-dlp/yt-dlp/releases/latest \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('tag_name',''))")
            [ -n "$TARGET" ] || { echo "::error::could not resolve latest yt-dlp release"; exit 1; }
          else
            TARGET="$PINNED"
          fi

          {
            echo "pinned=$PINNED"
            echo "target=$TARGET"
            if [ "$TARGET" != "$PINNED" ]; then echo "changed=true"; else echo "changed=false"; fi
          } >> "$GITHUB_OUTPUT"
          echo "Pinned: $PINNED | Target: $TARGET"
      -
        name: Bump yt-dlp version in Makefile
        if: steps.version.outputs.changed == 'true'
        run: |
          set -euo pipefail
          TARGET="${{ steps.version.outputs.target }}"
          sed -i "s|^YT_DLP_VERSION :=.*|YT_DLP_VERSION := $TARGET|" Makefile
          sed -i "s|^# https://github.com/yt-dlp/yt-dlp/releases/tag/.*|# https://github.com/yt-dlp/yt-dlp/releases/tag/$TARGET|" Makefile
          git diff -- Makefile
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      -
        name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          push: true
          platforms: linux/amd64
          tags: |
            nlopez/media-toolbox:${{ steps.version.outputs.target }}
            nlopez/media-toolbox:${{ steps.version.outputs.target }}-${{ github.sha }}
            nlopez/media-toolbox:${{ github.sha }}
            ghcr.io/nlopez/media-toolbox:${{ steps.version.outputs.target }}
            ghcr.io/nlopez/media-toolbox:${{ steps.version.outputs.target }}-${{ github.sha }}
            ghcr.io/nlopez/media-toolbox:${{ github.sha }}
          labels: |
            org.opencontainers.image.description=Media Toolbox: A Docker-based development environment with audio/video/CLI tools for media processing.
          build-args: |
            UID=1001
            GID=1001
            YT_DLP_VERSION=${{ steps.version.outputs.target }}
            BGUTIL_YTDLP_POT_PROVIDER_VERSION=2.0.2
          cache-from: |
            type=gha
            type=registry,ref=nlopez/media-toolbox:build-cache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=nlopez/media-toolbox:build-cache,mode=max
      -
        name: Commit yt-dlp version bump
        if: steps.version.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          TARGET="${{ steps.version.outputs.target }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makefile
          git commit -m "chore: bump yt-dlp to $TARGET [skip ci]"
          git push origin HEAD:main
